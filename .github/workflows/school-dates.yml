name: Yearly school dates refresh

on:
  schedule:
    - cron: "0 12 1 7 *"   # every July 1, 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf==6.15.0
      - name: Read the district calendar and update school_dates.json
        run: python school_calendar.py
      - name: Commit the new dates if they changed
        run: |
          git config user.name "school-dates-bot"
          git config user.email "actions@users.noreply.github.com"
          git add school_dates.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Update Confirmation school-year dates"
            git pull --rebase origin main
            git push
          fi
